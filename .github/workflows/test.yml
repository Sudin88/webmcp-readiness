name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci --no-audit --no-fund

      - name: audit
        run: npm audit --audit-level=high

      - name: safety tests (no browser needed)
        run: node server/safety.test.mjs

      # action/test.mjs runs the real serialised probe against a real page, so it
      # needs a browser. It was previously run in a job that installed none, which
      # fails on any runner without a cached Chromium.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: action tests
        run: node action/test.mjs

      - name: HTTP layer tests
        env:
          PORT: '8099'
        run: node server/http.test.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Detect Chromium sandbox support on this runner
        # Ubuntu runners can disable user namespaces, which prevents Chromium from
        # launching sandboxed. In that case, keep CI coverage by opting into the
        # explicit unsandboxed mode that scan.mjs already gates behind
        # ALLOW_UNSANDBOXED=1.
        run: |
          if node -e "
            import('playwright').then(async ({chromium}) => {
              const b = await chromium.launch({ chromiumSandbox: true });
              const p = await b.newPage();
              await p.goto('chrome://sandbox', { waitUntil: 'domcontentloaded', timeout: 10000 });
              const txt = await p.evaluate(() => document.body.innerText || '');
              await b.close();
              if (/no sandbox/i.test(txt)) process.exit(1);
            }).catch(() => process.exit(1));
          "; then
            echo 'sandbox OK'
          else
            echo 'Sandbox unavailable on this runner; enabling ALLOW_UNSANDBOXED=1 for CI e2e.'
            echo 'ALLOW_UNSANDBOXED=1' >> "$GITHUB_ENV"
          fi

      - name: end-to-end scan against a site with known tools
        run: |
          node -e "
            import('./server/scan.mjs').then(async ({scanUrl, closeBrowser}) => {
              const r = await scanUrl('https://www.proxy-compare.com');
              console.log('outcome:', r.outcome, 'tools:', r.toolsFound, 'high:', r.summary.high);
              await closeBrowser();
              if (r.outcome !== 'tools-observable' || r.toolsFound < 1) {
                console.error('FAIL: expected observable tools');
                process.exit(1);
              }
              console.log('e2e OK');
            }).catch((e) => { console.error('FAIL:', e.message); process.exit(1); });
          "