name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci --no-audit --no-fund

      - name: audit
        run: npm audit --audit-level=high

      - name: safety tests (no browser needed)
        run: node server/safety.test.mjs

      # action/test.mjs runs the real serialised probe against a real page, so it
      # needs a browser. It was previously run in a job that installed none, which
      # fails on any runner without a cached Chromium.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: action tests
        run: node action/test.mjs

      - name: HTTP layer tests
        env:
          PORT: '8099'
        run: node server/http.test.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Detect Chromium sandbox availability
        # Some GitHub-hosted runners disallow Chromium sandboxing (for example when
        # unprivileged user namespaces are restricted). If so, opt into the
        # repository's explicit unsandboxed mode for this e2e job only.
        run: |
          node -e "
            import('playwright').then(async ({chromium}) => {
              try {
                const b = await chromium.launch({ chromiumSandbox: true });
                const p = await b.newPage();
                await p.goto('chrome://sandbox', { waitUntil: 'domcontentloaded', timeout: 10000 });
                const txt = await p.evaluate(() => document.body.innerText || '');
                await b.close().catch(() => {});
                if (/no sandbox/i.test(txt)) throw new Error('NO_SANDBOX_REPORTED');
                console.log('sandbox OK');
              } catch (e) {
                const msg = String(e?.message || e);
                const knownSandboxBlock =
                  /No usable sandbox|NO_SANDBOX_REPORTED|Chromium sandboxing failed|zygote_host_impl_linux|Target page, context or browser has been closed/i.test(msg);
                if (!knownSandboxBlock) throw e;
                const { appendFileSync } = await import('node:fs');
                appendFileSync(process.env.GITHUB_ENV, 'ALLOW_UNSANDBOXED=1\\n');
                console.warn('sandbox unavailable on this runner; ALLOW_UNSANDBOXED=1 enabled for e2e');
              }
            }).catch((e) => { console.error('SANDBOX FAIL:', e.message); process.exit(1); });
          "

      - name: end-to-end scan against a site with known tools
        run: |
          node -e "
            import('./server/scan.mjs').then(async ({scanUrl, closeBrowser}) => {
              const r = await scanUrl('https://www.proxy-compare.com');
              console.log('outcome:', r.outcome, 'tools:', r.toolsFound, 'high:', r.summary.high);
              await closeBrowser();
              if (r.outcome !== 'tools-observable' || r.toolsFound < 1) {
                console.error('FAIL: expected observable tools');
                process.exit(1);
              }
              console.log('e2e OK');
            }).catch((e) => { console.error('FAIL:', e.message); process.exit(1); });
          "