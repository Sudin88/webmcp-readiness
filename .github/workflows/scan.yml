name: scan
on:
  schedule:
    # Weekly. The value of this report is the trend, not a single snapshot.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # No write token on disk while scan.mjs opens third-party pages in a
          # browser. The two push steps re-authenticate explicitly.
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the probe loads
        run: node -e "import('./lib/probe.mjs').then(()=>console.log('probe ok'))"

      - name: Snapshot the registry
        run: node fetch-registry.mjs

      - name: Scan
        run: |
          mkdir -p scans
          node scan.mjs --out "scans/$(date -u +%Y-%m-%d).json"
          cp "scans/$(date -u +%Y-%m-%d).json" scan-results.json

      - name: Build the report
        run: node build-site.mjs

      - name: Write trend to the log
        run: |
          cat > trend.md <<'EOF'
          # Scan history

          | date | tools observed | high | medium | info | registry tools |
          | --- | --- | --- | --- | --- | --- |
          EOF
          for f in $(ls -1 scans/*.json | sort); do
            node -e '
              const d=require("./"+process.argv[1]);
              const rows=[];
              for (const r of d.results) for (const f of r.findings) rows.push(f.severity);
              const c=s=>rows.filter(x=>x===s).length;
              console.log(`| ${d.scannedAt.slice(0,10)} | ${d.toolsObserved} | ${c("high")} | ${c("medium")} | ${c("info")} | ${d.registryToolTotal} |`);
            ' "$f" >> trend.md
          done
          cat trend.md

      - name: Commit the snapshot
        run: |
          git config user.name  "webmcp-readiness bot"
          git config user.email "bot@users.noreply.github.com"
          git add scans/ site/ trend.md scan-results.json
          git diff --staged --quiet || git commit -m "scan: $(date -u +%Y-%m-%d)"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push || echo "push skipped (fork or protected branch)"

      # Publish site/ as the root of a gh-pages branch. Uses `git subtree push`,
      # which pushes over the remote actions/checkout already authenticated, so no
      # token in a URL and no extra permission. An earlier version built a fresh
      # repo and pushed to an x-access-token URL; GITHUB_TOKEN resolved empty and
      # the push failed with "Invalid username or token".
      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git subtree push --prefix site origin gh-pages
          echo "gh-pages now at $(git rev-parse --short origin/gh-pages)"
