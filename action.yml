name: 'WebMCP Readiness'
description: 'Verify the WebMCP tools your site exposes to AI agents: output contracts, schema documentation, required-field enforcement, and tool budget.'
author: 'webmcp-readiness'
branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  config:
    description: 'Path to the config file listing the URLs to check.'
    required: false
    default: 'webmcp.config.json'
  fail-on:
    description: 'Which findings fail the build: high, medium, or none.'
    required: false
    default: 'high'
  fail-on-unreachable:
    description: 'Fail when a configured URL cannot be checked. Default true, so a broken site never passes silently.'
    required: false
    default: 'true'
  report-path:
    description: 'Where to write the JSON report.'
    required: false
    default: 'webmcp-report.json'
  github-summary:
    description: 'Write a Markdown summary to the job summary. Default true.'
    required: false
    default: 'true'
  baseline:
    description: 'Path to the baseline of known findings. If present, only NEW findings fail the build.'
    required: false
    default: 'webmcp-baseline.json'
  update-baseline:
    description: 'Rewrite the baseline to accept the current state, then exit. Prints every finding it absorbs. Default false.'
    required: false
    default: 'false'

outputs:
  tools-found:
    description: 'Number of WebMCP tools discovered across all URLs.'
  findings:
    description: 'Total number of findings (high + medium + info).'
  high:
    description: 'Number of high-severity findings.'
  report:
    description: 'Path to the JSON report.'
  baseline:
    description: 'Path to the written baseline (update-baseline mode only).'
  baseline-added:
    description: 'How many new findings the baseline update absorbed.'
  baseline-fixed:
    description: 'How many findings were fixed since the previous baseline.'

# Composite rather than a bundled dist/index.js on purpose.
# Playwright resolves its browser binary from its own package root at runtime, so
# bundling it with ncc produces a dist that throws MODULE_NOT_FOUND. Installing at
# run time is slower (~30s) but is the only approach that actually works.
runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        npm ci --omit=dev --no-audit --no-fund

    - name: Install Chromium
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        npx playwright install --with-deps chromium

    - name: Run WebMCP readiness checks
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FAIL_ON_UNREACHABLE: ${{ inputs.fail-on-unreachable }}
        INPUT_REPORT_PATH: ${{ inputs.report-path }}
        INPUT_GITHUB_SUMMARY: ${{ inputs.github-summary }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_UPDATE_BASELINE: ${{ inputs.update-baseline }}
      run: |
        cd "$GITHUB_ACTION_PATH"
        GITHUB_WORKSPACE="$GITHUB_WORKSPACE" node action/index.mjs
